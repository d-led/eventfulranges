# Publishes the browser-only (WebAssembly) build of the web visualizer to
# GitHub Pages. The Go session hub is compiled to wasm (GOOS=js GOARCH=wasm)
# and served as a pure static site — no Go server runs.
#
# The site appears at https://<owner>.github.io/eventfulranges/. Everything in
# demo/web/dist-local is path-relative, so it works from that subpath.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.sum
            demo/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo/web/ui-src/package-lock.json

      - name: Install UI dependencies
        run: npm ci
        working-directory: demo/web/ui-src

      - name: Build the browser-only bundle
        run: ./scripts/build-local.sh

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo/web/dist-local

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
