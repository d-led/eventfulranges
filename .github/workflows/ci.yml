name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger ("Run workflow") for the long-running quality gate.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.1
      - name: Lint demo module
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.1
          working-directory: demo
      - name: Run unit tests with coverage
        run: ./scripts/test.sh
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/coverage.out
          fail_ci_if_error: false

  # Long-running quality gate: only on manual trigger to keep PR checks fast.
  quality-gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Quality gate
        run: ./scripts/quality-gate.sh
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: reports
          path: |
            build/coverage.out
            build/reports/
          if-no-files-found: ignore

  kurrent-itest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Start KurrentDB
        run: ./scripts/kurrent-up.sh
      - name: Integration tests
        run: ./scripts/itest-kurrent.sh
      - name: Kurrent demo
        run: ./scripts/demo-kurrent.sh
      - name: Stop KurrentDB
        if: always()
        run: ./scripts/kurrent-down.sh

  demos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Hello demo
        run: ./scripts/demo-hello.sh
      - name: Local demo
        run: ./scripts/demo-local.sh
      - name: Network demo
        run: ./scripts/demo-network.sh
      - name: Pub/sub demo
        run: ./scripts/demo-pubsub.sh
      - name: Web demo (smoke test)
        run: ./scripts/itest-web.sh
      - name: Web demo (Playwright e2e)
        run: ./scripts/e2e-web.sh
