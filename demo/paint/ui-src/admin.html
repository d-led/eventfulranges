<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>eventfulranges · admin</title>
    <style>
      :root {
        --bg: #111318;
        --panel: #181b22;
        --fg: #e6e8ee;
        --muted: #9aa1b0;
        --accent: #4f8cff;
        --border: #2a2f3a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          15px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      .admin-main {
        max-width: 760px;
        margin: 0 auto;
        padding: 28px 20px 64px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 4px;
      }
      .admin-lede {
        color: var(--muted);
        font-size: 13px;
        margin: 0 0 20px;
      }
      .admin-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 16px 18px;
        margin-bottom: 16px;
      }
      .admin-card h2 {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin: 0 0 10px;
      }
      .admin-card p {
        margin: 0;
      }
      #storageBytes {
        font: 18px/1.3 ui-monospace, Menlo, Consolas, monospace;
      }
      #users {
        list-style: none;
        margin: 0;
        padding: 0;
        font: 13px/1.7 ui-monospace, Menlo, Consolas, monospace;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font: 13px/1.6 ui-monospace, Menlo, Consolas, monospace;
      }
      th,
      td {
        text-align: left;
        padding: 6px 8px;
        border-bottom: 1px solid var(--border);
      }
      th {
        color: var(--muted);
        font-weight: 500;
      }
      td.empty,
      li.empty {
        color: var(--muted);
      }
      td:first-child {
        word-break: break-all;
      }
      button {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--fg);
        padding: 6px 12px;
        font: inherit;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        border-color: var(--accent);
        color: var(--accent);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .admin-error {
        color: #ff9b9b;
        font: 13px ui-monospace, Menlo, Consolas, monospace;
        margin: 12px 0;
      }
      #refreshBtn {
        margin-top: 4px;
      }
      .back {
        display: inline-block;
        margin-bottom: 16px;
        color: var(--accent);
        text-decoration: none;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main class="admin-main">
      <h1>eventfulranges · admin</h1>
      <p class="admin-lede">Storage and sessions on this instance. Users are held in memory only.</p>
      <a class="back" href="/ui/">← back to the board</a>

      <section class="admin-card">
        <h2>Server storage</h2>
        <p id="storageBytes">…</p>
      </section>

      <section class="admin-card">
        <h2>Users who have logged in</h2>
        <ul id="users"></ul>
      </section>

      <section class="admin-card">
        <h2>Sessions</h2>
        <table>
          <thead>
            <tr>
              <th>Session</th>
              <th>Size</th>
              <th>Clients</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="sessions"></tbody>
        </table>
      </section>

      <p id="adminError" class="admin-error" hidden></p>
      <button id="refreshBtn" type="button">Refresh</button>
    </main>
    <script type="module" src="admin.js"></script>
  </body>
</html>
